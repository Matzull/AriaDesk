name: Linux build dependencies
description: Installs the system libraries Tauri needs on Linux, failing fast when the Ubuntu archive is unreachable.
runs:
  using: composite
  steps:
    # When the runner cannot resolve the Ubuntu archive, apt waits on every package for half an
    # hour; fail in under a minute instead so the run can simply be retried later.
    - name: Check that the Ubuntu archive resolves
      shell: bash
      run: |
        host=archive.ubuntu.com
        [ "$(dpkg --print-architecture)" = amd64 ] || host=ports.ubuntu.com
        for attempt in 1 2 3; do
          getent hosts "$host" && exit 0
          echo "$host does not resolve (attempt $attempt of 3)"
          sleep 10
        done
        echo "::error::$host does not resolve on this runner, so apt cannot install the build dependencies. Re-run the job later."
        exit 1
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
